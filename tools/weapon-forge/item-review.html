<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relic Forge · Equipment paint review</title><style>
*{box-sizing:border-box}body{margin:0;background:#191c19;color:#e6deca;font:14px/1.5 system-ui}main{max-width:1180px;margin:auto;padding:32px}a{color:#c9c496}h1{font:32px Georgia;margin:14px 0 8px}p{color:#b0b5a6}#grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:24px}article{border:1px solid #494d3e;background:#252a23;overflow:hidden;border-radius:4px}.art{height:285px;background:#918572;display:flex;justify-content:center}.art svg{height:100%;width:100%}.caption{padding:15px}h2{font:21px Georgia;margin:0 0 7px}.caption p{font-size:12px;margin:0}.index{font:11px system-ui;color:#b9bda9;display:block;margin-bottom:6px}@media(max-width:760px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px}}@media(max-width:460px){#grid{grid-template-columns:1fr}}</style>
<main><a href="/">← Relic Forge</a><h1>Armor, keepsakes & provisions.</h1><p>The remaining item constructions, with clean paint, consistent lighting, and no print distress. Materials and affixes remain editable in Relic Forge.</p><div id="grid"></div></main><script type="module">
import {headwearProfile} from './headwear.js';import {footwearProfile} from './footwear.js';import {legwearProfile} from './legwear.js';
import {ITEM_CATALOG,validateRecipe} from './model.js';import {renderWeapon} from './renderer.js';
const groups=new Map();for(const item of ITEM_CATALOG.filter(x=>!['sword','dagger','mace','wand'].includes(x.family))){const key=item.family+'/'+(item.family==='head'?headwearProfile(item).style:item.family==='legs'?legwearProfile(item).style:item.family==='feet'?footwearProfile(item).style:['charm','consumable'].includes(item.family)?item.name:item.shape);if(!groups.has(key))groups.set(key,item);}const studies=[...groups.values()];
document.getElementById('grid').innerHTML=studies.map((item,i)=>{const name=item.name,note=item.shape;const recipe=validateRecipe({version:2,item:item.id,weapon:item.family,material:['steel','bronze','bone','obsidian'][i%4],quality:'standard',prefix:'none',suffix:'none',seed:132});return `<article><div class="art">${renderWeapon(recipe,{uid:'review-'+i,distress:0})}</div><div class="caption"><span class="index">${String(i+1).padStart(2,'0')} / ${item.family.toUpperCase()}</span><h2>${name}</h2><p>${note}</p></div></article>`;}).join('');
</script></html>
