<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painted chest pieces · Relic Forge</title><style>body{margin:0;background:#1e251f;color:#eee4cc;font:16px system-ui}header{padding:25px 4%}h1,h2{font-family:Georgia}p{color:#bdc5b0}main{padding:0 3% 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}article{border:1px solid #525e45;border-radius:8px;overflow:hidden}h2{font-size:22px;padding:16px;margin:0}.art{background:#918572}img{width:100%;display:block}a{color:#d7e7b3;display:block;padding:12px}button{padding:9px 15px;background:#384532;color:#fff;border:1px solid #77876c;border-radius:5px;cursor:pointer}@media(max-width:1000px){main{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){main{grid-template-columns:1fr}}</style><header><h1>Painted chest pieces</h1><p>New brushwork and three-quarter poses. Artwork preview; color controls are not included.</p><button onclick="document.querySelectorAll('.art').forEach(x=>x.style.background='#918572')">Parchment</button> <button onclick="document.querySelectorAll('.art').forEach(x=>x.style.background='#202628')">Dark</button> <button onclick="document.querySelector('main').style.gridTemplateColumns='repeat(2,1fr)'">Larger previews</button></header><main id="gallery"></main><script>document.getElementById('gallery').innerHTML=[['chestplate','Plate cuirass'],['mail','Chainmail hauberk'],['tunic','Padded arming tunic'],['coat','Adventurer coat']].map(([id,name])=>'<article><h2>'+name+'</h2><div class="art"><img src="assets/painted/chest/'+id+'-base-v2.png" alt="'+name+'"></div><a download href="assets/painted/chest/'+id+'-base-v2.png">Download PNG</a></article>').join('');</script></html>
